name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单元测试（${{ matrix.os }} · py${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 跑在 22.04 上：ubuntu-latest（24.04）上 setup-python 取 3.9 会失败，
          # 这不是本项目的问题，但红叉会让人以为代码坏了。
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 项目本身零依赖；这里装的可选项只用于跑「字幕后端」相关的测试。
      - name: 安装可选依赖
        run: python -m pip install --upgrade pip pillow numpy

      - name: 安装本包
        run: python -m pip install -e .

      - name: 跑测试（stdlib unittest，没有 pytest）
        run: python -m unittest discover -s tests -t . -v

  skill:
    name: 技能规范 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 这条是「取其精华」里的关键一条：把格式合规变成可执行的 CI 动作。
      - name: 校验 SKILL.md
        run: python tools/lint_skill.py

  render:
    name: 真渲一条（冒烟）
    runs-on: ubuntu-latest
    # 冒烟用 --fast + 540×960 的小样分镜表（examples/demo/shotlist-ci.json）渲：
    # 这条 job 证明的是「克隆 → 装 → 出片 → 体检能跑通」，不是画质评审。
    # 交付档（默认 crf 15/18 + preset slow、1080×1920 带 zoompan）在 2 核 runner 上
    # 要跑十几二十分钟 —— 没人愿意为一条 13.8 秒的片子等那么久。
    # 顺带钉时限：真要挂住，20 分钟就红，别占着 6 小时的默认上限。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 装依赖与包
        run: |
          python -m pip install --upgrade pip pillow numpy
          python -m pip install -e .

      # 这个 job 的价值：证明「克隆 → 装 → 出片」真的能跑通。
      # 素材是 ffmpeg 现场合成的，不依赖 LFS 或示例大文件。
      - name: 合成演示素材
        run: python examples/demo/make_media.py --out examples/demo/materials

      - name: 校验分镜表（两个都校验，校验不花时间）
        run: |
          cutwright validate examples/demo/shotlist.json --check-files
          cutwright validate examples/demo/shotlist-ci.json --check-files

      - name: 出片 + 体检
        run: |
          cutwright build examples/demo/shotlist-ci.json -o out --check-files --fast
          cutwright qc examples/demo/shotlist-ci.json --mp4 "$(ls out/*.mp4 | head -1)"

      - name: 产物信息
        run: |
          ls -la out/
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of default=nw=1 "$(ls out/*.mp4 | head -1)"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-render
          path: out/*.mp4
          retention-days: 7
