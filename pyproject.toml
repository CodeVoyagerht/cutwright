[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutwright"
version = "0.1.0"
description = "剪匠 —— 用一份分镜表生成剪映草稿 / 达芬奇时间线 / 成片 MP4"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "北屿升" }]
keywords = ["video", "editing", "shotlist", "jianying", "capcut", "davinci-resolve", "ffmpeg", "agent", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = []

[project.optional-dependencies]
# 只有「直接渲染成 MP4」这条后端需要 Pillow：画字幕、花字要自己排版
render = ["pillow>=10.0"]
# 配乐节拍分析（可选功能）
beats = ["numpy>=1.24"]
dev = ["pillow>=10.0", "numpy>=1.24"]

[project.scripts]
cutwright = "cutwright.cli:main"

[project.urls]
Homepage = "https://github.com/beiyusheng/cutwright"
Issues = "https://github.com/beiyusheng/cutwright/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cutwright = ["templates/**/*", "*.json"]
